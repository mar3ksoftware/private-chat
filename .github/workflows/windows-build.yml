name: Windows build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the build to
        default: v1.0.0
        required: true
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get
        working-directory: mobile

      - name: Build release
        run: flutter build windows --release
        working-directory: mobile

      - name: Package
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Scattered-Keyhole-Windows-x64.zip -Force
        working-directory: mobile

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: mobile/Scattered-Keyhole-Windows-x64.zip
